name: smart_laundry_locker
description: "Smart Laundry Locker - Flutter Mobile App"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.1
  cached_network_image: ^3.4.1
  # Giữ lại: có package phụ thuộc dựng IconData trỏ font CupertinoIcons.
  # Gỡ đi thì font không được đóng gói và icon hiện ô vuông trống.
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  envied: ^1.3.2
  equatable: ^2.0.7
  file_picker: ^10.3.7
  flutter_animate: ^4.5.2
  flutter_cache_manager: ^3.4.1
  flutter_image_compress: ^2.4.0
  flutter_smart_dialog: ^5.0.1
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.1
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.2.3
  flutter_bloc: ^9.1.1
  go_router: ^17.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_cropper: ^11.0.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  logger: ^2.6.2
  lucide_icons_flutter: ^3.1.6
  permission_handler: ^12.0.1
  shadcn_ui: ^0.39.14
  url_launcher: ^6.3.2
  pretty_dio_logger: ^1.4.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  provider: ^6.1.5+1
  geolocator: ^13.0.2
  mobile_scanner: 7.2.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^20.1.0
  webview_flutter: ^4.13.1
  shared_preferences: ^2.5.4
  stomp_dart_client: ^3.0.1
  flutter_facebook_auth: ^7.1.5

dev_dependencies:
  build_runner: ^2.4.13
  envied_generator: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/markdown/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
