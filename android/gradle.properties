# Gradle JVM heap. 8G was oversized for a ~16GB machine that also runs the
# Docker backend stack + an Android emulator at the same time, which caused
# heavy swapping (slow builds / lag). 3G is plenty for a Flutter Android build.
# Drop to -Xmx2G if the machine still swaps while everything runs together.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Some Flutter plugins (e.g. flutter_facebook_auth) compile their own module with
# Kotlin jvmTarget=21 while defaulting Java to 1.8, which Gradle flags as an
# inconsistent-JVM-target error. App + Kotlin are aligned to 17; relax this check
# to a warning so a plugin's internal mismatch doesn't fail the whole build.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
